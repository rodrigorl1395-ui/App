<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060912" />
    <title>Pocket Habits</title>
    <script>
      // Antes de qualquer CSS: evita o flash do tema errado ao abrir o app.
      (function () {
        try {
          var raw = localStorage.getItem("pocket-habits:state:v1");
          var mode = (raw && JSON.parse(raw).settings && JSON.parse(raw).settings.theme) || "automatico";
          var claro = mode === "claro" || (mode === "automatico" && matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.setAttribute("data-theme", claro ? "claro" : "escuro");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "escuro");
        }
      })();
    </script>
    <link rel="preload" href="src/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="src/assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="src/css/tokens.css" />
    <link rel="stylesheet" href="src/css/base.css" />
    <link rel="stylesheet" href="src/css/layout.css" />
    <link rel="stylesheet" href="src/css/components.css" />
    <link rel="stylesheet" href="src/css/garden.css" />
    <link rel="stylesheet" href="src/css/animations.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="src/js/app.js"></script>
  </body>
</html>
